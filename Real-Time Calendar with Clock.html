<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Calendar with Clock</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ef3a3a , #030d1f, blue);
            color: #333;
        }
        
        .container {
            background: rgb(255, 255, 255);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
            border: 2px solid #fb017e;
            overflow: hidden;
            width: 350px;
        }
        
        .header {
            background: linear-gradient(135deg, #2a4de6 0%, #c287fd 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .month-year {
            font-size: 1.5rem;
            margin: 0;
            font-weight: 500;
        }
        
        .date-time {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid #585461;
        }
        
        .time {
            font-size: 2rem;
            font-weight: 300;
        }
        
        .day {
            font-size: 1.2rem;
            color: #666;
        }
        
        .calendar {
            padding: 15px;
           
        }
        
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            color: #666;
            margin-bottom: 10px;
        }
        
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        
        .day-number {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .day-number:hover {
            background-color: #f0f0f0;
        }
        
        .current-day {
            background: linear-gradient(135deg, #3559f8 0%, #c290f4 100%);
            color: white;
            font-weight: bold;
        }
        
        .other-month {
            color: #ccc;
        }
        
        .ampm {
            font-size: 1rem;
            margin-left: 5px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="month-year" id="month-year">Month Year</h1>
        </div>
        
        <div class="date-time">
            <div>
                <span class="time" id="time">00:00</span>
                <span class="ampm" id="ampm">AM</span>
            </div>
            <div class="day" id="day">Day</div>
        </div>
        
        <div class="calendar">
            <div class="weekdays">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>
            <div class="days" id="days"></div>
        </div>
    </div>

    <script>
        function updateClockAndCalendar() {
            const now = new Date();
            
            // Update Time
            const hours = (now.getHours() % 12 || 12).toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
            
            document.getElementById('time').textContent = `${hours}:${minutes}`;
            document.getElementById('ampm').textContent = ampm;
            
            // Update Day
            const dayOptions = { weekday: 'long' };
            document.getElementById('day').textContent = now.toLocaleDateString(undefined, dayOptions);
            
            // Update Calendar
            updateCalendar(now);
        }
        
        function updateCalendar(date) {
            const year = date.getFullYear();
            const month = date.getMonth();
            const currentDate = date.getDate();
            
            // Set month and year in header
            const monthOptions = { month: 'long', year: 'numeric' };
            document.getElementById('month-year').textContent = date.toLocaleDateString(undefined, monthOptions);
            
            // Get first day of month and total days in month
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // Get days from previous month
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            
            // Generate calendar days
            let daysHTML = '';
            
            // Previous month days
            for (let i = firstDay - 1; i >= 0; i--) {
                daysHTML += `<div class="day-number other-month">${daysInPrevMonth - i}</div>`;
            }
            
            // Current month days
            for (let i = 1; i <= daysInMonth; i++) {
                const isCurrentDay = i === currentDate;
                daysHTML += `<div class="day-number ${isCurrentDay ? 'current-day' : ''}">${i}</div>`;
            }
            
            // Next month days (to fill the grid)
            const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
            const nextMonthDays = totalCells - (firstDay + daysInMonth);
            
            for (let i = 1; i <= nextMonthDays; i++) {
                daysHTML += `<div class="day-number other-month">${i}</div>`;
            }
            
            document.getElementById('days').innerHTML = daysHTML;
        }
        
        // Initialize and update every second
        updateClockAndCalendar();
        setInterval(updateClockAndCalendar, 1000);
    </script>
</body>
</html>
